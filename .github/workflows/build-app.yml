name: Build and Release Android App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Consistent Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Determine Version Code and Name
        id: versioning
        run: |
          # Calculate monotonic version code from run number to guarantee seamless APK overwrite/update
          BASE_VERSION_CODE=100
          VERSION_CODE=$(( BASE_VERSION_CODE + ${{ github.run_number }} ))
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
          fi
          
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building version $VERSION_NAME ($VERSION_CODE)"

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Build Signed APKs
        run: |
          gradle :app:assembleRelease :app:assembleDebug \
            -PversionCode=${{ steps.versioning.outputs.VERSION_CODE }} \
            -PversionName=${{ steps.versioning.outputs.VERSION_NAME }}

      - name: Prepare Artifact Directory
        run: |
          mkdir -p dist
          
          # Copy release and debug APKs with clear version naming
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/Reminder-v${{ steps.versioning.outputs.VERSION_NAME }}-release.apk
          fi
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/Reminder-v${{ steps.versioning.outputs.VERSION_NAME }}-debug.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reminder-App-v${{ steps.versioning.outputs.VERSION_NAME }}
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
