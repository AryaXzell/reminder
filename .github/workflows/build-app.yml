name: Build and Release Android App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Consistent Keystore
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Determine Version Code and Name
        id: versioning
        run: |
          # Calculate monotonic version code from run number to guarantee seamless APK overwrite/update
          BASE_VERSION_CODE=100
          VERSION_CODE=$(( BASE_VERSION_CODE + ${{ github.run_number }} ))
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
          fi
          
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building version $VERSION_NAME ($VERSION_CODE)"

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            -PversionCode=${{ steps.versioning.outputs.VERSION_CODE }} \
            -PversionName=${{ steps.versioning.outputs.VERSION_NAME }}

      - name: Build Signed Release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PversionCode=${{ steps.versioning.outputs.VERSION_CODE }} \
            -PversionName=${{ steps.versioning.outputs.VERSION_NAME }}

      - name: Prepare Artifact Directory
        run: |
          mkdir -p dist
          
          # Copy all APKs (includes arm64, armeabi-v7a, dan universal)
          find app/build/outputs/apk -name "*.apk" -type f | while read -r apk; do
            cp "$apk" "dist/$(basename "$apk")"
          done
          
          # Rename untuk clarity
          cd dist
          for file in *.apk; do
            if [[ "$file" == *"arm64"* ]]; then
              newname="${file%%.apk}-arm64-v8a.apk"
              mv "$file" "$newname" 2>/dev/null || true
            elif [[ "$file" == *"armeabi"* ]]; then
              newname="${file%%.apk}-armeabi-v7a.apk"
              mv "$file" "$newname" 2>/dev/null || true
            elif [[ "$file" == *"universal"* ]]; then
              newname="${file%%.apk}-universal.apk"
              mv "$file" "$newname" 2>/dev/null || true
            fi
          done
          
          ls -lah

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reminder-App-v${{ steps.versioning.outputs.VERSION_NAME }}
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
