name: Build and Release Android App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Consistent Keystore
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Determine Version Code and Name
        id: versioning
        run: |
          # Calculate monotonic version code from run number to guarantee seamless APK overwrite/update
          BASE_VERSION_CODE=100
          VERSION_CODE=$(( BASE_VERSION_CODE + ${{ github.run_number }} ))
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
          fi
          
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building version $VERSION_NAME ($VERSION_CODE)"

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            -PversionCode=${{ steps.versioning.outputs.VERSION_CODE }} \
            -PversionName=${{ steps.versioning.outputs.VERSION_NAME }}

      - name: Build Signed Release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PversionCode=${{ steps.versioning.outputs.VERSION_CODE }} \
            -PversionName=${{ steps.versioning.outputs.VERSION_NAME }}

      - name: Prepare Artifact Directory
        run: |
          mkdir -p dist
          
          # Process release APK splits
          find app/build/outputs/apk/release -name "*.apk" -type f 2>/dev/null | while read -r apk; do
            filename=$(basename "$apk")
            if [[ "$filename" == *"arm64"* ]]; then
              cp "$apk" "dist/Reminder-v${{ steps.versioning.outputs.VERSION_NAME }}-release-arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi"* ]]; then
              cp "$apk" "dist/Reminder-v${{ steps.versioning.outputs.VERSION_NAME }}-release-armeabi-v7a.apk"
            elif [[ "$filename" == *"universal"* ]]; then
              cp "$apk" "dist/Reminder-v${{ steps.versioning.outputs.VERSION_NAME }}-release-universal.apk"
            else
              cp "$apk" "dist/$filename"
            fi
          done
          
          # Process debug APK splits
          find app/build/outputs/apk/debug -name "*.apk" -type f 2>/dev/null | while read -r apk; do
            filename=$(basename "$apk")
            if [[ "$filename" == *"arm64"* ]]; then
              cp "$apk" "dist/Reminder-v${{ steps.versioning.outputs.VERSION_NAME }}-debug-arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi"* ]]; then
              cp "$apk" "dist/Reminder-v${{ steps.versioning.outputs.VERSION_NAME }}-debug-armeabi-v7a.apk"
            elif [[ "$filename" == *"universal"* ]]; then
              cp "$apk" "dist/Reminder-v${{ steps.versioning.outputs.VERSION_NAME }}-debug-universal.apk"
            else
              cp "$apk" "dist/$filename"
            fi
          done
          
          echo "=== Generated Artifacts ==="
          ls -lah dist/

      - name: Upload Artifact 1: arm64-v8a (64-bit)
        uses: actions/upload-artifact@v4
        with:
          name: Reminder-v${{ steps.versioning.outputs.VERSION_NAME }}-arm64-v8a
          path: dist/*arm64-v8a*.apk
          retention-days: 30

      - name: Upload Artifact 2: armeabi-v7a (32-bit)
        uses: actions/upload-artifact@v4
        with:
          name: Reminder-v${{ steps.versioning.outputs.VERSION_NAME }}-armeabi-v7a
          path: dist/*armeabi-v7a*.apk
          retention-days: 30

      - name: Upload Artifact 3: Universal (All ABIs)
        uses: actions/upload-artifact@v4
        with:
          name: Reminder-v${{ steps.versioning.outputs.VERSION_NAME }}-universal
          path: dist/*universal*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
